<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bifrost · Data &amp; Score Wiki</title>
  <meta name="description" content="Interactive data wiki and score explorer for Bifrost: 757,597 AlphaFold 3 predictions of 2,811 plant NLR integrated domains against 373 pathogen and pest proteins." />
  <meta name="theme-color" content="#ffffff" />

  <!-- Bifrost 4-bar horizontal favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 44'%3E%3Crect x='2' y='2' width='4.4' height='21' rx='2.2' fill='%234cc9f0'/%3E%3Crect x='9' y='2' width='4.4' height='19.5' rx='2.2' fill='%234895ef'/%3E%3Crect x='16' y='2' width='4.4' height='18' rx='2.2' fill='%234361ee'/%3E%3Crect x='23' y='2' width='4.4' height='16.5' rx='2.2' fill='%233f37c9'/%3E%3Crect x='30' y='2' width='4.4' height='15' rx='2.2' fill='%233a0ca3'/%3E%3Crect x='2' y='26.5' width='4.4' height='15.5' rx='2.2' fill='%23f72585'/%3E%3Crect x='9' y='25' width='4.4' height='17' rx='2.2' fill='%23b5179e'/%3E%3Crect x='16' y='23.5' width='4.4' height='18.5' rx='2.2' fill='%237209b7'/%3E%3Crect x='23' y='22' width='4.4' height='20' rx='2.2' fill='%23560bad'/%3E%3Crect x='30' y='20.5' width='4.4' height='21.5' rx='2.2' fill='%23480ca8'/%3E%3C/svg%3E" />

  <!-- Typography: Area + Figtree (matching amiralito.github.io/thesis) + IBM Plex Mono -->
  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="preconnect" href="https://p.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/qac4why.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

  <script>
    (function () {
      var t = 'light';
      try {
        var saved = localStorage.getItem('bifrost-wiki-theme');
        if (saved === 'dark' || saved === 'light') t = saved;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#page">Skip to content</a>

  <div id="shell">
    <!-- Left Wiki Sidebar (inspired by BIFROST_TIER_WIKI) -->
    <aside id="side" aria-label="Wiki navigation">
      <div class="brand">
        <a href="#/" class="brand-link" aria-label="Bifrost home">
          <div class="brand-mark" aria-hidden="true">
            <i style="background:var(--cyan)"></i>
            <i style="background:var(--blue)"></i>
            <i style="background:var(--purple)"></i>
            <i style="background:var(--pink)"></i>
          </div>
          <h1>Bifrost</h1>
        </a>
      </div>

      <div class="side-search">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="side-q" type="search" placeholder="Search proteins, IDs…" autocomplete="off" aria-label="Quick search" />
        <kbd aria-hidden="true">/</kbd>
        <div id="side-results" class="side-results" hidden></div>
      </div>

      <nav id="nav" aria-label="Sections"></nav>

      <div class="side-foot">
        <a href="#/methods">AF3 v3.0.1</a>
        <span>757,597 models</span>
      </div>
    </aside>

    <!-- Mobile backdrop for drawer -->
    <div id="side-backdrop" class="side-backdrop" hidden></div>

    <!-- Main Reading & Explorer Pane -->
    <main id="main">
      <header class="topbar">
        <button type="button" class="icon-btn mobile-only" id="btn-menu" aria-label="Toggle navigation menu">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <div class="crumbs" id="crumbs">
          <span class="cur">Bifrost</span>
        </div>
        <div class="tb-right">
          <a class="icon-btn" href="https://amiralito.github.io" target="_blank" rel="noopener" title="AmirAli Toghani">
            <span>amiralito.github.io</span>
            <span aria-hidden="true">&#8599;</span>
          </a>
          <button type="button" class="icon-btn" id="btn-theme" aria-label="Toggle light or dark theme" title="Light / dark theme">
            <svg id="ico-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
            <svg id="ico-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
          </button>
        </div>
      </header>

      <article id="page" tabindex="-1">
        <div class="center-loading">
          <div class="spinner" aria-hidden="true"></div>
          <div>Loading Bifrost catalog…</div>
        </div>
      </article>
    </main>
  </div>

  <!-- Native Figure Zoom Lightbox (<dialog>) -->
  <dialog id="fig-lightbox" class="fig-dialog" aria-label="Enlarged figure">
    <div class="fig-dialog-shell" id="fig-lightbox-content"></div>
  </dialog>

  <!-- Native AlphaFold 3 JSON Input Generator (<dialog>) -->
  <dialog id="af3-json-dialog" class="af3-dialog" aria-label="Generate AlphaFold 3 input JSON">
    <div class="af3-dialog-shell" id="af3-json-content"></div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
